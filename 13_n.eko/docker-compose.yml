services:
  neko:
    image: 	ghcr.io/m1k1o/neko/vivaldi:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "56000-56100:56000-56100/udp"
    environment:
      NEKO_WEBRTC_EPR: "56000-56100"
      NEKO_WEBRTC_NAT1TO1: "127.0.0.1"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "neko"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "admin"
    volumes:
      # 名前付きボリューム(Windowsのホストパスは権限関連で入力が効かなくなったため不使用)
      # 初回だけ手元でタブを開いておけば、RestoreOnStartup(policy.json)で次回以降そのタブが復元される
      - "vivaldi-profile:/home/neko/.config/vivaldi"
      - "./policy.json:/etc/opt/vivaldi/policies/managed/policies.json:ro"

volumes:
  vivaldi-profile: