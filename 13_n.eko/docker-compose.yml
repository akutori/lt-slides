services:
  neko:
    image: 	ghcr.io/m1k1o/neko/vivaldi:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "56000-56100:56000-56100/udp"
    environment:
      NEKO_WEBRTC_EPR: "56000-56100"
      # 同じWi-Fiの端末から繋ぐには、ホストのLAN IPを指定する(127.0.0.1だと端末自身のlocalhostに繋ぎに行って失敗する)
      # 例: $env:NEKO_HOST_IP="192.168.2.115"; docker compose up -d
      NEKO_WEBRTC_NAT1TO1: "${NEKO_HOST_IP:-127.0.0.1}"
      # TURN中継(.envのNEKO_ICE_SERVERS。update-turn.ps1で生成)。未設定なら空配列
      NEKO_WEBRTC_ICESERVERS_FRONTEND: "${NEKO_ICE_SERVERS:-[]}"
      NEKO_WEBRTC_ICESERVERS_BACKEND: "${NEKO_ICE_SERVERS:-[]}"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "neko"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "admin"
    volumes:
      # 名前付きボリューム(Windowsのホストパスは権限関連で入力が効かなくなったため不使用)
      # 初回だけ手元でタブを開いておけば、RestoreOnStartup(policy.json)で次回以降そのタブが復元される
      - "vivaldi-profile:/home/neko/.config/vivaldi"
      - "./policy.json:/etc/opt/vivaldi/policies/managed/policies.json:ro"

volumes:
  vivaldi-profile: